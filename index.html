<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GreenPlayer · 隐私与支持</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="shell nav">
      <a class="brand" href="./" aria-label="GreenPlayer 首页">GreenPlayer</a>
      <nav aria-label="主要导航">
        <a href="privacy/">隐私政策</a>
        <a href="support/">技术支持</a>
      </nav>
    </div>
  </header>

  <main class="shell hero">
    <p class="eyebrow">GREENPLAYER</p>
    <h1>播放属于你的媒体，<br>数据也属于你。</h1>
    <p class="lead">这里提供 GreenPlayer 的公开隐私政策和技术支持信息。页面无需登录即可访问，不使用分析脚本、广告或 Cookie。</p>

    <div class="card-grid">
      <a class="card" href="privacy/">
        <span class="card-kicker">PRIVACY</span>
        <h2>隐私政策</h2>
        <p>了解本机数据、第三方服务器、iCloud 同步、权限和删除方式。</p>
        <span class="card-action">查看隐私政策 →</span>
      </a>
      <a class="card" href="support/">
        <span class="card-kicker">SUPPORT</span>
        <h2>技术支持</h2>
        <p>查看故障排查方法，提交问题，或通过 TestFlight 发送 Beta 反馈。</p>
        <span class="card-action">获取支持 →</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <span>© 2026 张仁杰 · GreenPlayer</span>
      <span>此站点不提供媒体内容</span>
    </div>
